<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>IQly ad 320×50</title>
<style>
/* 320×50 mobile banner. Static. No external assets. Visible border (AdX rule for light backgrounds). */
html,body{margin:0;background:#fff}
.ad{position:relative;width:320px;height:50px;box-sizing:border-box;background:#f6f2ea;border:1px solid #d9d2c3;display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#1c2331;overflow:hidden}
.logo{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;font-size:19px;letter-spacing:-.01em;line-height:1;flex:none}
.logo b{background:#ffd23f;padding:0 3px;border-radius:2px}
.txt{flex:1;min-width:0;line-height:1.15;overflow:hidden}
.txt .h{font-size:15px;font-weight:700;white-space:nowrap}
.txt .s{font-size:11px;color:#4a5160;white-space:nowrap}
.cta{flex:none;background:#1c2331;color:#f6f2ea;font-size:12px;font-weight:700;padding:7px 11px;border-radius:6px;white-space:nowrap}
</style></head>
<body><div class="ad" role="img" aria-label="IQly. Free IQ test: 12 questions, about 5 minutes, no payment. Not a clinical IQ assessment. Start the test.">
  <div class="logo">IQ<b>ly</b></div>
  <div class="txt"><div class="h">Free IQ test</div><div class="s">12 questions · ~5 min · no payment</div></div>
  <div class="cta">Start</div>
</div></body></html>
